<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vishal Files</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background:
                linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
                url("background.jpg") center center / cover no-repeat;

            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-transform: uppercase;
        }

        main {
            width: 100%;
            max-width: 900px;
            padding: 60px 30px;

            text-align: center;

            transform: translateY(-80px);
        }

        h1 {
            position: relative;

            margin: 0;
            padding-bottom: 15px;

            border-bottom: 2px solid #d00000;

            font-size: 48px;
            letter-spacing: 4px;
            font-weight: 800;

            animation: glitch 3s infinite;
        }

        h1::before {
            content: "CLASSIFIED / INVESTIGATION";

            display: block;

            margin-bottom: 12px;

            color: #d00000;

            font-size: 12px;
            font-weight: bold;
            letter-spacing: 4px;

            animation: flicker 2s infinite;
        }

        div {
            margin-top: 40px;

            padding-left: 15px;

            border-left: 3px solid #d00000;
        }

        a {
            position: relative;

            color: #ffffff;

            font-size: 18px;
            font-weight: bold;

            letter-spacing: 2px;

            text-decoration: none;

            transition: color 0.2s ease;

            animation: glitch 4s infinite;
        }

        a::after {
            content: " →";

            color: #d00000;
        }

        a:hover {
            color: #d00000;
        }

        /* GLITCH EFFECT */

        @keyframes glitch {
            0% {
                transform: translate(0);
            }

            92% {
                transform: translate(0);
            }

            93% {
                transform: translate(-2px, 1px);
            }

            94% {
                transform: translate(2px, -1px);
            }

            95% {
                transform: translate(-1px, 0);
            }

            96% {
                transform: translate(1px, 1px);
            }

            97% {
                transform: translate(0);
            }

            100% {
                transform: translate(0);
            }
        }

        /* SMALL SCREEN */

        @media (max-width: 600px) {

            main {
                padding: 50px 20px;
                transform: translateY(-50px);
            }

            h1 {
                font-size: 34px;
                letter-spacing: 3px;
            }

            h1::before {
                font-size: 10px;
                letter-spacing: 3px;
            }

            a {
                font-size: 15px;
            }
        }

        /* FLICKERING CLASSIFIED TEXT */

        @keyframes flicker {
            0%,
            18%,
            22%,
            63%,
            64%,
            65%,
            100% {
                opacity: 1;
            }

            19%,
            21%,
            62% {
                opacity: 0.4;
            }

            23% {
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>

    <main>

        <h1>The Vishal Files</h1>

        <div>
            <a href="mainpage.html">Click to see the reality</a>
        </div>

    </main>

</body>
</html>
